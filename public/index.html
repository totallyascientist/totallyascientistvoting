<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2025 Idol Korean GP Fan Vote</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- PRIMARY COUNTDOWN (TOP) -->
<div id="countdown"></div>

<!-- DRIVER GRID -->
<div class="grid" id="grid"></div>

<!-- VOTE BUTTON -->
<button id="voteBtn">VOTE NOW</button>

<!-- VOTE CONFIRMATION OVERLAY -->
<div id="overlay" onclick="closeOverlay()">
  <img id="overlayImg">
  <button id="shareBtn">🔗 SHARE MY VOTE</button>
</div>

<!-- STANDINGS TITLE -->
<h2 id="standingsTitle">CURRENT STANDINGS</h2>

<!-- TIMING TOWER WRAPPER -->
<div id="towerWrap">

  <!-- TIMING TOWER IMAGE (BACKGROUND LAYER) -->
  <img
    src="media/timing-tower.png"
    id="tower"
    style="position: relative; z-index: 1;"
  >

  <!-- DUPLICATED COUNTDOWN (OVERLAY, ABOVE IMAGE) -->
  <div
    id="towerCountdown"
    style="position:absolute; z-index:10;"
  ></div>

  <!-- TIMING TOWER DATA (NAMES + % ABOVE IMAGE) -->
  <div
    id="towerData"
    style="position:absolute; inset:0; z-index:5;"
  ></div>

</div>

<script src="vote.js"></script>

</body>
</html>
